# server/setup.sh を GitHub の Ubuntu 22.04 で試す（証明書の取得以外を全部実行）
name: Server test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: 前半（パッケージ・binder・イメージ作成）
        run: set -o pipefail; sudo STOP_BEFORE_RUN=1 SKIP_CERT=1 bash server/setup.sh android.test test@example.com 2>&1 | tee /tmp/setup1.log
      - name: イメージとカーネルの確認
        run: |
          docker images
          uname -r; lsmod | grep binder || true
          grep binder /proc/filesystems || true
      - name: Android を起動してみる（5 分）
        timeout-minutes: 10
        run: |
          set +e
          sudo SKIP_CERT=1 timeout 600 bash server/setup.sh android.test test@example.com > /tmp/setup2.log 2>&1 &
          for i in $(seq 1 20); do
            sleep 15
            echo "--- ${i}: $(docker ps --format '{{.Names}} {{.Status}}')"
            sudo dmesg | tail -5
            adb -s 127.0.0.1:5555 shell getprop sys.boot_completed 2>&1 | head -1
            grep "=== " /tmp/setup2.log | tail -1
          done
          docker logs androidpad 2>&1 | tail -30
      - name: 後半のログ
        if: always()
        run: cat /tmp/setup2.log | tail -60
      - name: 動作確認
        if: always()
        run: |
          adb devices
          adb -s 127.0.0.1:5555 shell getprop ro.product.cpu.abilist
          adb -s 127.0.0.1:5555 shell pm list packages | grep -E 'vending|gms' || echo "Google Play が見つからない"
          systemctl status androidpad-scrcpy --no-pager | head -10
          PASS=$(sudo cat /etc/nginx/androidpad.token)
          echo "認証なし: $(curl -s -o /dev/null -w '%{http_code}' -H 'Host: android.test' http://127.0.0.1/)"
          echo "Basic認証: $(curl -s -o /dev/null -w '%{http_code}' -u "android:$PASS" -H 'Host: android.test' http://127.0.0.1/)"
          echo "クッキー: $(curl -s -o /dev/null -w '%{http_code}' -b "androidpad_token=$PASS" -H 'Host: android.test' http://127.0.0.1/)"
          echo "外から18000: $(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://$(hostname -I | awk '{print $1}'):18000/ || true)"
          adb -s 127.0.0.1:5555 exec-out screencap -p > /tmp/screen.png
          python3 -c "
          from PIL import Image; import base64, io
          im=Image.open('/tmp/screen.png').convert('RGB'); print('画面', im.size)
          b=io.BytesIO(); im.resize((180,320)).save(b,'PNG'); print('[png]', base64.b64encode(b.getvalue()).decode())
          " || true
